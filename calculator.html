<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة ذكية</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-back {
            align-self: flex-start;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .calculator {
            background-color: #22252d;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .display {
            width: 100%;
            height: 60px;
            background-color: #292d36;
            color: #ffffff;
            font-size: 28px;
            text-align: left;
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            direction: ltr;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 55px;
            border-radius: 12px;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background-color: #272b33;
            color: #ffffff;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-op {
            color: #eb6666;
        }

        .btn-action {
            color: #26e7a6;
        }

        .btn-equal {
            background-color: #26e7a6;
            color: #22252d;
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">⬅ العودة للمعرض</a>

    <div class="calculator">
        <input type="text" id="display" class="display" readonly>

        <div class="buttons">
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button class="btn-action" onclick="deleteLast()">DEL</button>
            <button class="btn-op" onclick="appendValue('/')">÷</button>
            <button class="btn-op" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-op" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-op" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('0')">0</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "خطأ";
                setTimeout(() => clearDisplay(), 1500);
            }
        }
    </script>

</body>
</html>
