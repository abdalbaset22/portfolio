<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك - مواصفات Figma</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-back {
            align-self: flex-start;
            margin-bottom: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        .pricing-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: #ffffff;
        }

        .badge {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .price span {
            font-size: 14px;
            color: #94a3b8;
        }

        .features {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: right;
            font-size: 14px;
            color: #cbd5e1;
        }

        .features li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-subscribe {
            background-color: #6366f1;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-subscribe:active {
            opacity: 0.8;
        }

        #sub-status {
            margin-top: 15px;
            font-size: 14px;
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">⬅ العودة للمعرض</a>

    <div class="pricing-card">
        <span class="badge">الأكثر شعبية</span>
        <h2>الخطة الاحترافية</h2>
        <div class="price">29$ <span>/ شهرياً</span></div>

        <ul class="features">
            <li>✓ وصول لا محدود لكافة الكورسات</li>
            <li>✓ مشاريع عمل حقيقية</li>
            <li>✓ دعم فني مباشر 24/7</li>
        </ul>

        <button class="btn-subscribe" onclick="subscribe()">اشترك الآن</button>
        <div id="sub-status"></div>
    </div>

    <script>
        function subscribe() {
            document.getElementById("sub-status").innerText = "🎉 تم الاشتراك بنجاح! أهلاً بك معنا.";
        }
    </script>

</body>
</html>
